name: Auto-build upstream releases for Intel macOS

# Tracks upstream's stable releases. For each stable version this fork has not
# published yet, it creates `sync/<tag>` from the upstream release commit with
# this fork's customizations merged on top, pushes that branch, and dispatches
# the two Intel (x64) build workflows against it.
#
# Nightlies and previews are upstream prereleases and are intentionally skipped.
# If the merge conflicts (upstream edited a file this fork customizes), the job
# fails without pushing; sync it by hand before the next release.

on:
  schedule:
    # Every six hours, away from the busiest scheduled slots.
    - cron: "23 1,7,13,19 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "Upstream stable version to build (for example 0.0.45). Defaults to the newest upstream stable release this fork has not built."
        required: false
        type: string
      force:
        description: "Rebuild and republish even if the fork already has this release (for example after a fix, to fill in a missing artifact)."
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: write

concurrency:
  group: auto-build-upstream
  cancel-in-progress: false

jobs:
  plan:
    name: Pick upstream version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.pick.outputs.version }}
      tag: ${{ steps.pick.outputs.tag }}
      needed: ${{ steps.pick.outputs.needed }}
    steps:
      - name: Resolve version
        id: pick
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          if [[ -n "${INPUT_VERSION:-}" ]]; then
            version="${INPUT_VERSION#v}"
          else
            # /releases/latest excludes prereleases and drafts; the plain list
            # endpoint can return 50+ nightlies without ever reaching the newest
            # stable, which previously made this job fail.
            version="$(gh api repos/pingdotgg/t3code/releases/latest --jq .tag_name | sed 's/^v//')"
          fi
          if [[ -z "$version" || "$version" == "null" ]]; then
            echo "No upstream stable release found." >&2
            exit 1
          fi
          tag="v${version}"
          if [[ "${INPUT_FORCE:-}" == "true" ]]; then
            needed=true
            echo "Force rebuild requested; ignoring any existing release for ${tag}."
          else
            # A release can exist with only one artifact (for example when the
            # desktop job OOMs after the CLI job published). Require both.
            assets="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null || true)"
            cli_asset="t3-${version}-darwin-x64.tar.gz"
            dmg_asset="T3-Code-${version}-x64.dmg"
            if grep -qxF "$cli_asset" <<< "$assets" && grep -qxF "$dmg_asset" <<< "$assets"; then
              needed=false
              echo "This fork already has both artifacts for ${tag}; nothing to build."
            else
              needed=true
              echo "This fork is missing an artifact for ${tag} (CLI=${cli_asset}, DMG=${dmg_asset}); it will be built."
            fi
          fi
          {
            echo "version=${version}"
            echo "tag=${tag}"
            echo "needed=${needed}"
          } >> "$GITHUB_OUTPUT"

  sync:
    name: Sync ${{ needs.plan.outputs.tag }} and dispatch builds
    needs: plan
    if: needs.plan.outputs.needed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.plan.outputs.version }}
      TAG: ${{ needs.plan.outputs.tag }}
    steps:
      # actions/checkout's credential cleanup runs `submodule foreach` even with
      # submodules disabled, which fails on the orphaned gitlinks under .repos/.
      - name: Create sync branch
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git remote add upstream "https://github.com/pingdotgg/t3code.git"
          # Full history is needed for a real merge base; the fork's main already
          # carries upstream history up to its base, so this is not a full clone
          # of either repository.
          git fetch --no-tags origin main
          git fetch --no-tags upstream "refs/tags/${TAG}:refs/tags/${TAG}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "sync/${TAG}" "refs/tags/${TAG}"
          if ! git merge --no-edit origin/main; then
            # Upstream owns packages/shared/src/cliRelease.ts and its test; the
            # fork only needs two small edits on top. Re-apply them on upstream's
            # copy rather than hand-merging, so upstream refactors of that file
            # never block a release. Upstream also rewrites the desktop
            # environment test, where the fork's extra macOS assertion only
            # documents the clientAssetsDir fix; keep upstream's copy on sync
            # branches. Any other conflict still fails below.
            git checkout "refs/tags/${TAG}" -- \
              packages/shared/src/cliRelease.ts \
              packages/shared/src/cliRelease.test.ts \
              apps/desktop/src/app/DesktopEnvironment.test.ts
            sed -i 's#const CLI_RELEASE_REPOSITORY = "pingdotgg/t3code";#const CLI_RELEASE_REPOSITORY = "Coder-soft/t3code";#' packages/shared/src/cliRelease.ts
            sed -i 's#^  "darwin-arm64",#  "darwin-arm64",\n  "darwin-x64",#' packages/shared/src/cliRelease.ts
            sed -i 's#pingdotgg/t3code#Coder-soft/t3code#g' packages/shared/src/cliRelease.test.ts
            sed -i 's#expect(cliArchivePlatformKey("darwin", "x64")).toBeUndefined();#expect(cliArchivePlatformKey("darwin", "x64")).toBe("darwin-x64");#' packages/shared/src/cliRelease.test.ts
            # The two build scripts carry the fork's Intel changes. Their
            # copies on main are rebased onto the matching upstream tag, so
            # keep those instead of merging the fork's old base.
            git checkout origin/main -- \
              scripts/build-cli-archive.ts \
              scripts/build-desktop-artifact.ts
            git add \
              packages/shared/src/cliRelease.ts \
              packages/shared/src/cliRelease.test.ts \
              apps/desktop/src/app/DesktopEnvironment.test.ts \
              scripts/build-cli-archive.ts \
              scripts/build-desktop-artifact.ts
            if git ls-files -u | grep -q .; then
              echo "::error::Merge conflicts remain outside the auto-resolved cliRelease and desktop environment test files. Resolve them by hand, then re-run this workflow."
              git --no-pager diff --name-only --diff-filter=U
              exit 1
            fi
            git commit --no-edit
          fi
          # GITHUB_TOKEN may not create or update workflow files. Make the sync
          # branch carry the default branch's workflow files verbatim; upstream's
          # workflow edits are not needed to build this fork.
          rm -rf .github/workflows
          git checkout origin/main -- .github/workflows
          git add -A .github/workflows
          git commit --amend --no-edit
          # Local branches would be the merge target, not a conflict marker; a
          # failed merge above already exited.
          git push --force origin "sync/${TAG}"

      - name: Dispatch Intel builds
        shell: bash
        run: |
          set -euo pipefail
          for workflow in build-darwin-x64.yml build-macos-x64-desktop.yml; do
            gh workflow run "$workflow" \
              --repo "$GITHUB_REPOSITORY" \
              --ref "sync/${TAG}" \
              -f "version=${VERSION}" \
              -f "publish_release=true"
            echo "Dispatched ${workflow} on sync/${TAG} for ${VERSION}."
          done
